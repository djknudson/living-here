# Living Here — "fishbucket" aquarium sensor node
# Elegoo ESP-WROOM-32 (esp32dev) running ESPHome.
#
# Sensors:
#   - BOJACK DS18B20 waterproof temp probe -> GPIO4 (1-Wire; module has its own pull-up)
#   - HiLetgo/Gravity analog TDS probe      -> GPIO34 (ADC1, WiFi-safe), powered from 5V
#
# Wiring (Freenove ESP32 breakout):
#   DS18B20:  RED->3V3   BLACK->GND   YELLOW(DATA)->GPIO4
#   TDS:      VCC->5V(VIN) GND->GND    A(signal)->GPIO34
#
# First flash is over USB; every flash after that is OTA over WiFi.

esphome:
  name: fishbucket-sensors
  friendly_name: Fishbucket Sensors

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

# Native encrypted connection to Home Assistant (auto-discovered).
api:
  encryption:
    key: !secret api_encryption_key

# Wireless updates after the first USB flash.
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # If WiFi drops, expose a fallback AP so the node stays reachable.
  ap:
    ssid: "Fishbucket-Sensors Fallback"
    password: !secret ap_password

captive_portal:

# --- 1-Wire bus (DS18B20 temperature) ---
one_wire:
  - platform: gpio
    pin: GPIO4
    id: bus_a

# --- I2C bus (BMP280 ambient temp + pressure, OUTSIDE the tank) ---
# ESP32 default I2C pins. scan:true logs detected addresses on boot so we can
# confirm the BMP280 address (0x76 vs 0x77).
i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

# --- HA-facing calibration control for the TDS probe ---
# After dropping the probe in a known solution (e.g. 707 ppm @ 25C),
# adjust K until "Water TDS" matches the reference.
number:
  - platform: template
    name: "TDS Calibration K"
    id: tds_k
    optimistic: true
    min_value: 0.10
    max_value: 5.00
    step: 0.01
    initial_value: 1.00
    restore_value: true
    entity_category: config

sensor:
  # Water temperature. `address:` is optional with a single probe on the bus.
  - platform: dallas_temp
    one_wire_id: bus_a
    id: water_temp
    name: "Water Temperature"
    resolution: 12
    update_interval: 10s

  # Raw ADC voltage from the TDS probe (diagnostic; feeds the ppm calc below).
  - platform: adc
    pin: GPIO34
    id: tds_voltage
    name: "TDS Sensor Voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 3
    attenuation: 12db
    samples: 20
    update_interval: 10s
    entity_category: diagnostic
    filters:
      - sliding_window_moving_average:
          window_size: 10
          send_every: 2

  # Temperature-compensated TDS in ppm. Order matches the DFRobot GravityTDS
  # library: the cubic runs on the RAW probe voltage, then the resulting EC is
  # normalized to 25 C (conductivity rises ~2%/C), then EC -> ppm via the 0.5 factor.
  #   EC   = (133.42*V^3 - 255.86*V^2 + 857.39*V) * K     # K = calibration gain
  #   EC25 = EC / (1 + 0.02*(T-25))                       # normalize to 25 C
  #   TDS  = EC25 * 0.5                                    # NaCl (442 would be ~0.7)
  - platform: template
    name: "Water TDS"
    id: water_tds
    unit_of_measurement: "ppm"
    accuracy_decimals: 0
    state_class: measurement
    update_interval: 10s
    lambda: |-
      float v = id(tds_voltage).state;
      if (isnan(v)) return NAN;
      float t = id(water_temp).has_state() ? id(water_temp).state : 25.0;
      float k = id(tds_k).has_state() ? id(tds_k).state : 1.0;
      float ec = (133.42*v*v*v - 255.86*v*v + 857.39*v) * k;
      float ec25 = ec / (1.0 + 0.02 * (t - 25.0));
      float tds = ec25 * 0.5;
      return tds < 0 ? 0 : tds;

  # BMP280 — ambient air OUTSIDE the tank (I2C). Pressure + air temperature.
  # If the boot log's I2C scan shows 0x77 instead of 0x76, change address below.
  - platform: bmp280_i2c
    address: 0x76
    update_interval: 10s
    temperature:
      name: "Air Temperature"
      id: air_temp
      oversampling: 16x
    pressure:
      name: "Air Pressure"
      id: air_pressure
